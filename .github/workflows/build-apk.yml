name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0a1a' --iconBackgroundColorDark '#0b0a1a'

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GITHUB-MANAGER.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GITHUB-MANAGER-APK
          path: GITHUB-MANAGER.apk

      - name: Publish APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GITHUB MANAGER build ${{ github.run_number }}
          files: GITHUB-MANAGER.apk
